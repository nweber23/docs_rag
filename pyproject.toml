[project]
name = "docs-rag"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_rag"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
mypy_path = "src"
